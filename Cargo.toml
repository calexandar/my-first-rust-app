[package]
name = "rust-inertia-app"
version = "0.1.0"
edition = "2024"

[dependencies]
inertia-laravel-rust = { git = "https://github.com/inertiajs/inertia-laravel-rust", rev = "f8c46e734cedeea99a5417783b4d7a6488c062f8", default-features = false, features = ["axum", "tower-sessions"] }
argon2 = "0.6"
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros"] }
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["fs"] }
tower-sessions = { version = "0.15", default-features = false, features = ["axum-core"] }
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores", rev = "be0f230fadb4ca0496d4cabc946ae7778eee37e6", features = ["postgres"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
